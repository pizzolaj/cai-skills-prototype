:root{
  color-scheme: light;
  --red:#C41F3E; --red-dark:#A01830; --burgundy:#8B1D41; --red-bg:#FAF1F3; --red-light:#F5E3E8; --red-soft:#E7A3B0;
  --ink:#383B3E; --ink-2:#606366; --ink-3:#86888A; --disabled:#BBBCBC;
  --line:#D9D9D6; --sel:#E8E8E6; --app:#F2F3F2; --chat:#F7F7F6; --white:#FFFFFF;
  --ok:#397952; --ok-bg:#E7F2ED; --warn:#A35F00; --warn-bg:#FFF3D6; --info:#1F5FBF; --info-bg:#DEE9F7;
  --proto:#23262A; --proto-2:#34383D;
  --r-s:4px; --r-m:8px; --r-l:12px; --r-xl:20px;
  --sh-pop:0 6px 16px rgba(0,0,0,.14), 0 1px 3px rgba(0,0,0,.08);
  --sh-modal:0 18px 48px rgba(0,0,0,.22);
  --f:"Whitney","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--app);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}
svg.lucide{width:18px;height:18px;stroke-width:1.75;flex:none}
.i16 svg.lucide, svg.lucide.i16{width:16px;height:16px}
.i14 svg.lucide{width:14px;height:14px}
.i20 svg.lucide{width:20px;height:20px}
.i22 svg.lucide{width:22px;height:22px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ── Prototype bar ─────────────────────────── */
#shell{display:flex;flex-direction:column;height:100%}
.proto{background:var(--proto);color:#E9EAEB;display:flex;align-items:center;gap:14px;padding:0 16px;min-height:46px;flex:none}
.proto-name{font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:#fff;display:flex;align-items:center;gap:8px}
.proto-name .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
.flows{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.flows::-webkit-scrollbar{display:none}
.flow{white-space:nowrap;padding:6px 11px;border-radius:999px;font-size:13px;color:#C9CBCD;display:flex;align-items:center;gap:6px}
.flow:hover{background:var(--proto-2);color:#fff}
.flow[aria-current="true"]{background:#fff;color:var(--proto)}
.flow .n{font-size:11px;font-weight:600;opacity:.7;font-variant-numeric:tabular-nums}
.proto-reset{white-space:nowrap;font-size:13px;color:#C9CBCD;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px}
.proto-reset:hover{background:var(--proto-2);color:#fff}
.hint{background:#FFFBEF;border-bottom:1px solid #EFE3C0;color:#5B4A16;font-size:13px;padding:7px 16px;display:flex;gap:8px;align-items:center;flex:none}
.hint b{font-weight:600}
.hint[hidden]{display:none}
.test .proto,.test .hint,.test .starters{display:none!important}
.hint .x{margin-left:auto;color:#8A7433;display:flex}

/* ── App frame ─────────────────────────────── */
#app{flex:1;min-height:0;display:flex}
.rail{width:66px;flex:none;background:var(--app);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
.rail-btn{width:44px;height:40px;border-radius:var(--r-m);display:grid;place-items:center;color:var(--ink);position:relative}
.rail-btn:hover{background:var(--sel)}
.rail-btn[aria-current="page"]{background:var(--sel);color:var(--red)}
.rail-btn .tip{position:absolute;left:52px;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:40}
.rail-btn:hover .tip,.rail-btn:focus-visible .tip{opacity:1}
.rail-sep{height:14px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;margin-top:auto}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--white)}

/* ── Shared components ─────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r-m);font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--white);transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.btn:hover{background:var(--app)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-dark);border-color:var(--red-dark)}
.btn.primary:disabled{background:var(--red-soft);border-color:var(--red-soft);cursor:not-allowed}
.btn.ok{background:#1F6B45;border-color:#1F6B45;color:#fff}
.btn.ok:hover{background:#185737}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--app)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn:disabled{cursor:not-allowed;opacity:.6}
.icon-btn{width:34px;height:34px;border-radius:var(--r-m);display:grid;place-items:center;border:1px solid var(--line);background:var(--white);color:var(--ink)}
.icon-btn:hover{background:var(--app)}
.icon-btn[aria-expanded="true"]{background:var(--sel)}
.icon-btn.plain{border-color:transparent;background:transparent}
.icon-btn.plain:hover{background:var(--app)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--red);background:var(--red-bg);border:1px solid var(--red-soft);border-radius:999px;padding:1px 8px;line-height:16px;white-space:nowrap}
.lock{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--red);background:var(--red-bg);border:1px solid var(--red-soft);border-radius:999px;padding:2px 10px 2px 8px;white-space:nowrap}
.count{min-width:22px;height:20px;padding:0 7px;border-radius:999px;background:var(--sel);color:var(--ink-2);font-size:12px;font-weight:600;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.pill-status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px}
.pill-status.pending{background:var(--warn-bg);color:var(--warn)}
.pill-status.approved{background:var(--ok-bg);color:var(--ok)}
.pill-status.rejected{background:var(--red-bg);color:var(--red)}
.pill-status.neutral{background:var(--app);color:var(--ink-2)}
.switch{width:40px;height:22px;border-radius:999px;background:var(--disabled);position:relative;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--red)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.menu{position:absolute;z-index:30;background:var(--white);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-pop);padding:6px;min-width:220px}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:var(--r-m);text-align:left;font-size:14px}
.menu-item:hover,.menu-item.active{background:var(--app)}
.menu-item .chev{margin-left:auto;color:var(--ink-3)}
.menu-item.danger{color:var(--red)}
.menu-sep{height:1px;background:var(--line);margin:6px 4px}
.menu-label{font-size:12px;color:var(--ink-3);padding:6px 10px 4px}
.segment{display:inline-flex;background:var(--app);border:1px solid var(--line);border-radius:var(--r-m);padding:2px}
.segment button{padding:4px 12px;border-radius:6px;font-size:13px;color:var(--ink-2)}
.segment button[aria-pressed="true"]{background:var(--ink);color:#fff}
.field-label{font-weight:600;font-size:14px;margin-bottom:8px;display:block}
.input,.textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;background:var(--white);outline:none;transition:border-color .15s}
.input:focus,.textarea:focus{border-color:var(--red)}
.textarea{resize:vertical;min-height:84px}
.help{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.help.err{color:var(--red)}
.chk{width:18px;height:18px;border:1.5px solid var(--ink-2);border-radius:4px;display:grid;place-items:center;flex:none;background:var(--white)}
.chk[aria-checked="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chk svg.lucide{width:13px;height:13px;stroke-width:3}
.radio{width:18px;height:18px;border:1.5px solid var(--ink-2);border-radius:50%;flex:none;display:grid;place-items:center;background:var(--white)}
.radio[aria-checked="true"]{border-color:var(--red)}
.radio[aria-checked="true"]::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--red)}
.empty-note{color:var(--ink-3);font-size:13px}

/* ── Markdown ──────────────────────────────── */
.md{font-size:14.5px;color:var(--ink)}
.md h1{font-size:20px;font-weight:600;margin:0 0 12px;text-wrap:balance}
.md h2{font-size:16.5px;font-weight:600;margin:20px 0 8px}
.md h3{font-size:15px;font-weight:600;margin:16px 0 6px}
.md p{margin:0 0 10px;max-width:92ch}
.md ul,.md ol{margin:0 0 10px;padding-left:22px;max-width:90ch}
.md li{margin:3px 0}
.md code{font-family:var(--mono);font-size:12.5px;background:var(--app);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.md pre{background:#1E2124;color:#E6E7E8;border-radius:var(--r-m);padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;margin:8px 0 12px}
.md pre code{background:none;border:0;padding:0;color:inherit}
.src{font-family:var(--mono);font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--ink);margin:0}

/* ── Skills page ───────────────────────────── */
.skills{display:grid;grid-template-columns:360px 1fr;height:100%;min-height:0}
.sk-side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--white)}
.sk-head{display:flex;align-items:center;gap:8px;padding:20px 20px 12px;position:relative}
.sk-head h1{font-size:22px;font-weight:600;margin:0;flex:1}
.sk-search{padding:0 20px 8px}
.sk-tree{flex:1;overflow:auto;padding:4px 12px 16px}
.grp{display:flex;align-items:center;gap:8px;padding:8px 8px;width:100%;border-radius:var(--r-m);font-weight:600;font-size:14px}
.grp:hover{background:var(--app)}
.grp .caret{color:var(--ink-2);transition:transform .15s}
.grp[aria-expanded="false"] .caret{transform:rotate(-90deg)}
.grp .count{margin-left:auto}
.sk-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px 8px 30px;border-radius:var(--r-m);font-size:14px;color:var(--ink-2);text-align:left}
.sk-item:hover{background:var(--app)}
.sk-item[aria-current="true"]{background:var(--sel);color:var(--ink);font-weight:600}
.sk-item .ic{color:var(--ink-2)}
.sk-item.ent .ic{color:var(--red)}
.sk-item[aria-current="true"] .ic{color:var(--red)}
.sk-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sk-item.off .nm{color:var(--disabled);text-decoration:line-through}
.sk-item .chk{margin-left:-6px}
.folder-row{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 30px;font-size:14px;color:var(--ink-2)}
.folder-row input{border:1px solid var(--red);border-radius:6px;padding:3px 8px;flex:1;min-width:0;outline:none}
.folder-empty{padding:0 10px 6px 58px;font-size:12.5px;color:var(--ink-3)}
.bulk{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bulk .n{font-size:13px;color:var(--ink-2);margin-right:auto}

.sk-detail{min-width:0;overflow:auto;display:flex;flex-direction:column}
.det-head{padding:20px 28px 18px;border-bottom:1px solid var(--line)}
.det-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.det-title h2{font-size:22px;font-weight:600;margin:0;word-break:break-word}
.det-actions{margin-left:auto;display:flex;align-items:center;gap:10px;position:relative}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,max-content));column-gap:56px;row-gap:12px;margin-top:18px}
.meta dt{font-size:13px;color:var(--ink-3);margin-bottom:4px}
.meta dd{margin:0;font-size:14px}
.desc{margin-top:16px}
.desc dt{font-size:13px;color:var(--ink-3);margin-bottom:4px}
.desc dd{margin:0;font-size:14px;max-width:110ch}
.det-body{padding:20px 28px 32px}
.doc-card{border:1px solid var(--line);border-radius:var(--r-l);padding:20px 24px 24px;background:var(--white)}
.doc-card .bar{display:flex;justify-content:flex-end;margin-bottom:8px}
.off-note{display:flex;gap:8px;align-items:center;background:var(--app);border-radius:var(--r-m);padding:10px 12px;font-size:13.5px;color:var(--ink-2);margin-bottom:16px}

/* ── Modal ─────────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(35,38,42,.45);display:grid;place-items:center;z-index:50;padding:24px 16px;animation:fade .15s ease}
@keyframes fade{from{opacity:0}}
.modal{background:var(--white);border-radius:var(--r-xl);box-shadow:var(--sh-modal);width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{width:min(1000px,100%);height:min(720px,100%)}
.modal.narrow{width:min(460px,100%)}
.m-head{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
.m-head h3{margin:0;font-size:21px;font-weight:600;flex:1}
.m-body{padding:22px 24px;overflow:auto;display:flex;flex-direction:column;gap:20px}
.m-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line)}

.dir{display:grid;grid-template-columns:200px 1fr;flex:1;min-height:0}
.dir-nav{background:var(--app);padding:18px 12px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.dir-nav .lab{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ink-2);text-transform:uppercase;padding:0 8px 8px}
.dir-nav button{display:flex;align-items:center;gap:8px;padding:8px;border-radius:var(--r-m);font-size:14px;color:var(--ink-2)}
.dir-nav button:hover{background:var(--sel)}
.dir-nav button[aria-current="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.dir-nav .count{margin-left:auto;background:#fff;border:1px solid var(--line)}
.dir-nav button[aria-current="true"] .count{background:var(--red-bg);color:var(--red);border-color:var(--red-soft)}
.dir-main{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.searchbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-l);padding:0 12px;height:42px;background:#fff}
.searchbox:focus-within{border-color:var(--red)}
.searchbox input{border:0;outline:none;flex:1;min-width:0;background:transparent}
.dir-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dir-tools .res{font-size:13px;color:var(--ink-3)}
.select{height:34px;border:1px solid var(--line);border-radius:var(--r-m);padding:0 10px;background:#fff;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.dcard{border:1px solid var(--line);border-radius:var(--r-l);padding:14px 16px;background:#fff;text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.dcard:hover{box-shadow:0 4px 12px rgba(0,0,0,.10)}
.dcard.installed{border-color:var(--red)}
.dcard .top{display:flex;align-items:center;gap:6px}
.dcard .nm{font-family:var(--mono);font-size:13.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dcard .d{font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pubrow{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink-3)}
.pubrow .pub{display:inline-flex;align-items:center;gap:5px}
.pubrow .pub::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--burgundy)}
.pubrow .ins{display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.mini{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--ink-2)}
.mini:hover{background:var(--app);color:var(--ink)}
.mini.on{color:var(--red)}
.dd-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dd-head h4{margin:0;font-family:var(--mono);font-size:17px;font-weight:600}
.dd-files{display:grid;grid-template-columns:220px 1fr;border:1px solid var(--line);border-radius:var(--r-l);min-height:320px;overflow:hidden}
.dd-files .tree{padding:10px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.dd-files .tree button{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;font-size:13px;text-align:left}
.dd-files .tree button[aria-current="true"]{background:var(--red);color:#fff}
.dd-files .tree button:not([aria-current="true"]):hover{background:var(--app)}
.dd-files .file{display:flex;flex-direction:column;min-width:0}
.dd-files .fhead{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.dd-files .fbody{padding:16px 18px;overflow:auto;max-height:360px}
.drop{border:1.5px dashed var(--disabled);border-radius:var(--r-l);padding:36px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:background .15s,border-color .15s}
.drop:hover,.drop.over{border-color:var(--red);background:var(--red-bg)}
.drop .big{font-size:16px;font-weight:500}
.drop .sub{font-size:13px;color:var(--ink-3)}
.reqs{margin:0;padding-left:20px;font-size:14px;color:var(--ink-2)}
.reqs li{margin:4px 0}
.up-list{display:flex;flex-direction:column;gap:8px}
.up-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;font-size:13.5px}
.up-row .fn{font-family:var(--mono);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up-row.ok .st{color:var(--ok)} .up-row.bad .st{color:var(--red)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px}

/* ── Workspace ─────────────────────────────── */
.ws-top{height:48px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px 0 16px;gap:12px}
.ws-top .back{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2)}
.ws-top .back:hover{color:var(--ink)}
.ws{flex:1;min-height:0;display:flex}
.ws-side{width:240px;flex:none;border-right:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.ws-side .wn{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
.ws-side .wn h2{margin:0;font-size:19px;font-weight:600}
.side-link{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--r-m);font-size:14px;width:100%;text-align:left}
.side-link:hover{background:var(--app)}
.side-sep{height:1px;background:var(--line);margin:8px 0}
.side-h{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:6px 8px;font-weight:500}
.sess{display:flex;justify-content:space-between;gap:8px;padding:9px 8px;border-radius:var(--r-m);font-size:14px;color:var(--ink-2);width:100%;text-align:left}
.sess:hover{background:var(--app)}
.sess[aria-current="true"]{background:var(--sel);color:var(--ink)}
.sess .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .d{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.chat{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--chat);position:relative}
.chat-head{padding:12px 24px;display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:15px;flex:none}
.thread{flex:1;overflow:auto;padding:8px 24px 16px;scroll-behavior:smooth}
.thread-inner{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.hero{max-width:800px;margin:0 auto;width:100%;padding:0 0 18px}
.hero h2{font-size:30px;font-weight:600;margin:0 0 6px;text-wrap:balance}
.hero p{margin:0;color:var(--ink-2)}
.chat.empty .thread{display:flex;flex-direction:column;justify-content:center}
.chat.empty .composer-wrap{position:static}
.starters{display:flex;flex-wrap:wrap;gap:8px;max-width:800px;margin:14px auto 0;width:100%}
.starter{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px;color:var(--ink-2);text-align:left}
.starter:hover{border-color:var(--ink-3);color:var(--ink)}
.starter code{font-family:var(--mono);font-size:12.5px;color:var(--red)}

.u-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.u-msg{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);padding:10px 14px;max-width:min(430px,85%);white-space:pre-wrap;word-break:break-word}
.u-msg .cmd{color:var(--red);font-weight:500}
.files{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--red-bg);color:var(--red);border-radius:999px;padding:4px 8px 4px 12px;font-size:13.5px;border:1px solid var(--red-light)}
.fchip button{display:grid;place-items:center;color:var(--red);width:20px;height:20px;border-radius:50%}
.fchip button:hover{background:var(--red-light)}
.fchip.static{padding-right:12px}
.cai{display:flex;flex-direction:column;gap:8px}
.cai-name{display:flex;align-items:center;gap:6px;color:var(--red);font-weight:600;font-size:15px}
.cai-text{color:var(--ink)}
.cai-text p{margin:0 0 6px}
.cai-text ul{margin:4px 0;padding-left:22px}
.cai-text code,.cai-text .skl{font-family:var(--mono);font-size:13px;color:var(--red)}
.tools{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tools .mini{width:30px;height:30px}
.disc{font-size:11.5px;color:var(--ink-2);background:var(--sel);border-radius:999px;padding:3px 10px;margin-left:4px}
.typing{display:flex;gap:5px;align-items:center;height:22px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
.typing em{font-size:13px;color:var(--ink-3);margin-left:6px}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

.trace{display:flex;flex-direction:column;gap:6px}
.tr-row{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--ink);width:fit-content;text-align:left}
.tr-row .lbl b{font-weight:600}
.tr-row .chev{color:var(--ink-2);transition:transform .15s}
.tr-row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.tr-sub{font-size:13px;color:var(--ink-2);padding-left:26px}
.tr-row .spin{animation:spin 1s linear infinite;color:var(--red)}
@keyframes spin{to{transform:rotate(360deg)}}
.tr-detail{margin:4px 0 6px 26px;background:#fff;border:1px solid var(--line);border-radius:var(--r-l);padding:14px 16px;display:flex;flex-direction:column;gap:10px;max-width:560px}
.tr-detail .cap{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.tr-detail p{margin:0;font-size:13.5px;color:var(--ink-2)}
.seg-tbl{border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.seg-tbl div{display:flex;justify-content:space-between;padding:8px 12px;font-size:13.5px;font-variant-numeric:tabular-nums}
.seg-tbl div+div{border-top:1px solid var(--app)}
.neg{color:var(--red)} .pos{color:var(--ok)}
.link{color:var(--info);font-size:13.5px;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline}

const I = (n, cls = "") => `<i data-lucide="${n}"${cls ? ` class="${cls}"` : ""}></i>`;
const icons = () => { try { lucide.createIcons({ attrs: { "stroke-width": 1.75 } }); } catch (e) {} };

/* ── Tiny markdown renderer ─────────────────────────────── */
function inline(t) {
  return esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|\W)\*([^*]+)\*(?=\W|$)/g, "$1<em>$2</em>");
}
function md(src) {
  const L = src.split("\n"); let h = "", i = 0;
  while (i < L.length) {
    const l = L[i];
    if (l.startsWith("```")) { let b = []; i++; while (i < L.length && !L[i].startsWith("```")) b.push(L[i++]); i++; h += `<pre><code>${esc(b.join("\n"))}</code></pre>`; continue; }
    if (/^#{1,3} /.test(l)) { const n = l.match(/^#+/)[0].length; h += `<h${n}>${inline(l.slice(n + 1))}</h${n}>`; i++; continue; }
    if (/^\s*- /.test(l)) { h += "<ul>"; while (i < L.length && /^\s*- /.test(L[i])) h += `<li>${inline(L[i++].replace(/^\s*- /, ""))}</li>`; h += "</ul>"; continue; }
    if (/^\d+\. /.test(l)) { h += "<ol>"; while (i < L.length && /^\d+\. /.test(L[i])) h += `<li>${inline(L[i++].replace(/^\d+\. /, ""))}</li>`; h += "</ol>"; continue; }
    if (!l.trim()) { i++; continue; }
    let p = []; while (i < L.length && L[i].trim() && !/^(#{1,3} |\s*- |\d+\. |```)/.test(L[i])) p.push(L[i++]);
    h += `<p>${inline(p.join(" "))}</p>`;
  }
  return h;
}

  if (k === "q-other") { const i = +t.dataset.v, m = getMsg(i), q = (m.set === "deck" ? DECK_Q : CREDIT_Q)[m.idx];
    let a = m.ans[m.idx] || { sel: q.type === "multi" ? [] : null, other: "" }; a.other = t.value;
    if (t.value.trim()) { if (q.type === "multi" && !a.sel.includes(-1)) a.sel.push(-1); if (q.type !== "multi") a.sel = -1; }
    m.ans[m.idx] = a; const b = $("#q-next-" + i); if (b) b.disabled = !hasAnswer(q, a);
    const c = $("#q-count-" + i); if (c) c.textContent = a.sel.length + " selected"; return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "dir-sort") { S.dir.sort = t.value; render(); }
  if (t.id === "up-file") readFiles(t.files);
  if (t.dataset && t.dataset.in === "folder") { const f = S.folders.find(x => x.id === t.dataset.v); f.name = t.value.trim() || "Untitled folder"; f.editing = false; render(); toast(`Folder “${esc(f.name)}” created`); }
});
document.addEventListener("focusout", e => {
  const t = e.target;
  if (t.dataset && t.dataset.in === "folder") { const f = S.folders.find(x => x.id === t.dataset.v); if (f && f.editing) { f.name = t.value.trim() || "Untitled folder"; f.editing = false; setTimeout(render, 0); } }
});
function readFiles(list) {
  const arr = [...list]; let left = arr.length; const out = [];
  if (!left) return;
  arr.forEach(f => {
    if (/\.md$/i.test(f.name)) { const r = new FileReader(); r.onload = () => { out.push({ name: f.name, text: String(r.result), size: f.size }); if (!--left) addUploads(out); }; r.onerror = () => { out.push({ name: f.name, text: "", size: f.size }); if (!--left) addUploads(out); }; r.readAsText(f); }
    else { out.push({ name: f.name, size: f.size }); if (!--left) addUploads(out); }
  });
}
["dragover", "dragleave", "drop"].forEach(ev => document.addEventListener(ev, e => {
  const d = e.target.closest && e.target.closest("#drop"); if (!d) return;
  e.preventDefault();
  if (ev === "dragover") d.classList.add("over"); else d.classList.remove("over");
  if (ev === "drop" && e.dataTransfer?.files?.length) readFiles(e.dataTransfer.files);
}));

if (TEST) startTask(TASK);
render();
})();
</script>
